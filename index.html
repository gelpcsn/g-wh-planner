<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G WH Planner - Minimalist SaaS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        saas: {
                            bg: '#F3F4F2',
                            surface: '#FFFFFF',
                            text: '#111111',
                            muted: '#858585',
                            border: '#EAECE9',
                            accent: '#65F49A',
                            soft: '#DDFCE7',
                            control: '#F6F7F6'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F3F4F2; 
            color: #111111;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom Light Mode Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
        
        /* Hide scrollbar for top nav */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .stagger-1 { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) 0.05s both; }
        .stagger-2 { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) 0.1s both; }
        .stagger-3 { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) 0.15s both; }
        
        /* Minimalist Bento Cards & Modals */
        .bento-card {
            background-color: #FFFFFF;
            border: 1px solid #EAECE9;
            border-radius: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }
        .bento-card:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border-color: #D1D5DB;
        }

        .modal-overlay { 
            background-color: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(8px); 
        }

        /* SaaS Buttons */
        .btn-primary {
            background: #111111;
            border: 1px solid #000000;
            color: #FFFFFF;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: #222222;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }
        
        .btn-secondary {
            background: #F6F7F6;
            border: 1px solid #EAECE9;
            color: #111111;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover {
            background: #EAECE9;
            border-color: #D1D5DB;
        }

        /* Decorative Background Blob */
        .bg-blob {
            position: absolute;
            top: -10%;
            right: -5%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(221, 252, 231, 0.8) 0%, rgba(243, 244, 242, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex text-saas-text selection:bg-saas-accent selection:text-saas-text">

    <div id="app" class="flex flex-col h-full w-full bg-saas-bg relative">
        <!-- Decorative Floating Panel -->
        <div class="bg-blob"></div>

        <!-- Mobile Header -->
        <header class="md:hidden bg-white border-b border-saas-border px-4 py-3 flex justify-between items-center z-30 shadow-sm relative">
            <div class="flex items-center gap-2 font-bold text-saas-text tracking-tight">
                <div class="w-8 h-8 rounded bg-saas-text flex items-center justify-center text-saas-accent shadow-sm">
                    <i data-lucide="box" class="w-4 h-4"></i>
                </div>
                Planner
            </div>
            <button onclick="app.toggleMobileMenu()" class="text-saas-muted hover:text-saas-text transition-colors">
                <i data-lucide="menu"></i>
            </button>
        </header>

        <!-- Sidebar Navigation transformed to Top Navigation (Injected by JS) -->
        <aside id="sidebar" class="w-64 md:w-full bg-white md:border-b border-r md:border-r-0 border-saas-border flex flex-col md:flex-row md:items-center transition-transform duration-300 absolute md:relative z-40 h-full md:h-16 -translate-x-full md:translate-x-0 shadow-sm md:shadow-none"></aside>
        
        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden relative z-10">
            <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-8 relative"></main>
        </div>
        
        <!-- Mobile Overlay -->
        <div id="mobile-overlay" onclick="app.toggleMobileMenu()" class="hidden fixed inset-0 bg-black/20 backdrop-blur-sm z-30 md:hidden transition-opacity"></div>
    </div>

    <!-- Modals -->
    <div id="modal-container" class="hidden fixed inset-0 z-[100] overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 modal-overlay transition-opacity" aria-hidden="true" onclick="app.closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div id="modal-content" class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl w-full border border-saas-border">
                <!-- Modal content injected here -->
            </div>
        </div>
    </div>

    <script>
        // --- STORAGE INTEGRATION (NETLIFY BLOB + LOCAL STORAGE FALLBACK) ---
        const API_ENDPOINT = '/.netlify/functions/storage';

        async function syncData(data) {
            localStorage.setItem('g_wh_planner_data', JSON.stringify(data));
            try {
                await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (error) {
                console.warn("Netlify Blob sync not configured or unreachable. Data saved locally.");
            }
        }

        async function initStorage() {
            try {
                const response = await fetch(API_ENDPOINT);
                if (response.ok) {
                    const data = await response.json();
                    state.shipments = data || [];
                } else {
                    throw new Error("Blob API not found");
                }
            } catch (error) {
                console.log("Loading from Local Storage fallback...");
                const localData = localStorage.getItem('g_wh_planner_data');
                state.shipments = localData ? JSON.parse(localData) : [];
            }
            render();
        }

        // --- CONSTANTS & CONFIG (Light Theme Adapted) ---
        const WAREHOUSES = [
            { id: 'NJ', name: 'NJ Warehouse', colors: { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', tag: 'bg-blue-50 text-blue-700 border border-blue-200' } },
            { id: 'GA', name: 'GA Warehouse', colors: { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', tag: 'bg-emerald-50 text-emerald-700 border border-emerald-200' } },
            { id: 'TX', name: 'TX Warehouse', colors: { bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-200', tag: 'bg-orange-50 text-orange-700 border border-orange-200' } },
            { id: 'CA', name: 'CA Warehouse', colors: { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', tag: 'bg-purple-50 text-purple-700 border border-purple-200' } },
        ];

        const DESTINATIONS = ['JEBEL ALI', 'AJMAN', 'KHOR FAKKAN', 'UMM QASR', 'AQABA, JORDAN', 'MERSIN, TURKEY', 'BINGAZI, LIBYA', 'AL KHUMS, LIBYA', 'POTI, GEORGIA', 'COTONOU, BENIN', 'LOME, TOGO', 'TEMA, GHANA', 'TINCAN, NIGERIA', 'BEIRUT, LEBANON', 'OTHER'];
        const SHIPPING_LINES = ['MAERSK', 'MSC', 'CMA CGM', 'ARKAS', 'TURKON', 'HAPAG-LLOYD', 'EVERGREEN', 'OTHER'];
        const CONTAINER_SIZES = ['20FT', '40HC', '45HC', 'OTHER'];

        // --- UTILS ---
        const generateId = () => crypto.randomUUID();
        const todayStr = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const formatDisplayDate = (dateStr) => {
            if (!dateStr) return 'Unscheduled';
            const d = new Date(dateStr + 'T00:00:00');
            if (isNaN(d.getTime())) return 'Invalid Date';
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${String(d.getDate()).padStart(2, '0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
        };
        const diffDays = (date1, date2) => {
            const d1 = new Date(date1 + 'T00:00:00');
            const d2 = new Date(date2 + 'T00:00:00');
            return Math.round((d1 - d2) / (1000 * 60 * 60 * 24));
        };
        const escapeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        };

        // --- STATE MANAGEMENT ---
        const state = {
            shipments: [], 
            currentView: 'DASHBOARD',
            isMobileMenuOpen: false,
            tableState: { searchTerm: '', sortBy: 'siDate', sortAsc: true },
            calendarDate: new Date(),
            calendarViewMode: 'COMBINED'
        };

        // --- CORE ACTIONS ---
        const actions = {
            saveShipment: async (data) => {
                const id = data.id || generateId();
                const payload = { ...data, id };
                if (!data.id) {
                    payload.isArchived = false;
                    payload.createdAt = new Date().toISOString();
                } else {
                    payload.updatedAt = new Date().toISOString();
                }
                
                const index = state.shipments.findIndex(s => s.id === id);
                if (index > -1) {
                    state.shipments[index] = payload;
                } else {
                    state.shipments.push(payload);
                }
                
                await syncData(state.shipments);
                app.closeModal();
                renderTableBody();
            },
            deleteShipment: (id) => {
                const html = `
                    <div class="px-5 pt-5 pb-4 sm:p-6 sm:pb-4 border-b border-saas-border flex justify-between items-center bg-saas-control/50">
                        <h3 class="text-lg leading-6 font-bold text-red-600 flex items-center gap-2">
                            <i data-lucide="alert-triangle" class="text-red-500"></i> Confirm Deletion
                        </h3>
                        <button onclick="app.closeModal()" class="text-saas-muted hover:text-saas-text transition-colors"><i data-lucide="x"></i></button>
                    </div>
                    <div class="px-5 py-5 sm:p-6 bg-white space-y-5">
                        <p class="text-saas-muted text-sm">Are you sure you want to permanently delete this record? This action cannot be undone.</p>
                        <div class="flex justify-end gap-3 pt-4 border-t border-saas-border mt-4">
                            <button onclick="app.closeModal()" class="btn-secondary px-4 py-2 text-sm font-medium rounded-xl shadow-sm">Cancel</button>
                            <button onclick="app.executeDelete('${id}')" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-xl shadow-sm hover:bg-red-700 flex items-center gap-2 transition-all">
                                <i data-lucide="trash-2" class="w-4 h-4"></i> Delete Record
                            </button>
                        </div>
                    </div>
                `;
                window.app.openModal(html);
            },
            executeDelete: async (id) => {
                state.shipments = state.shipments.filter(s => s.id !== id);
                await syncData(state.shipments);
                window.app.closeModal();
                renderTableBody();
            },
            archiveShipment: async (id) => {
                const shipment = state.shipments.find(s => s.id === id);
                if (shipment) {
                    shipment.isArchived = true;
                    await syncData(state.shipments);
                    renderTableBody();
                }
            },
            restoreShipment: async (id) => {
                const shipment = state.shipments.find(s => s.id === id);
                if (shipment) {
                    shipment.isArchived = false;
                    await syncData(state.shipments);
                    renderTableBody();
                }
            },
            exportCSV: (records, filename) => {
                if (records.length === 0) {
                    const html = `
                        <div class="px-5 pt-5 pb-4 sm:p-6 sm:pb-4 border-b border-saas-border flex justify-between items-center bg-saas-control/50">
                            <h3 class="text-lg leading-6 font-bold text-saas-text flex items-center gap-2">
                                <i data-lucide="info" class="text-saas-muted"></i> Export Notice
                            </h3>
                            <button onclick="app.closeModal()" class="text-saas-muted hover:text-saas-text"><i data-lucide="x"></i></button>
                        </div>
                        <div class="px-5 py-5 sm:p-6 bg-white">
                            <p class="text-saas-muted text-sm">No records to export for this selection.</p>
                            <div class="flex justify-end pt-4 mt-4 border-t border-saas-border">
                                <button onclick="app.closeModal()" class="btn-secondary px-4 py-2 text-sm font-medium rounded-xl shadow-sm">Close</button>
                            </div>
                        </div>
                    `;
                    return window.app.openModal(html);
                }
                const headers = ['Warehouse', 'Destination', 'Shipping Line', 'Vessel', 'S.I. Date', 'Container Size', 'Container Count', 'Notes', 'Archived'];
                const rows = records.map(s => [
                    s.warehouse, `"${s.destination || ''}"`, s.shippingLine, s.vessel, s.siDate, s.containerSize, s.containerCount,
                    `"${(s.notes || '').replace(/"/g, '""')}"`, s.isArchived ? 'Yes' : 'No'
                ]);
                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join("\n");
                const link = document.createElement("a");
                link.setAttribute("href", encodeURI(csvContent));
                link.setAttribute("download", `${filename}_${todayStr()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        };

        // --- GLOBAL APP OBJECT ---
        window.app = {
            ...actions,
            toggleMobileMenu: () => {
                state.isMobileMenuOpen = !state.isMobileMenuOpen;
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('mobile-overlay');
                if (state.isMobileMenuOpen) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            },
            navigate: (viewId) => {
                state.currentView = viewId;
                state.tableState.searchTerm = ''; 
                if(state.isMobileMenuOpen) window.app.toggleMobileMenu();
                render();
            },
            openModal: (contentHTML) => {
                document.getElementById('modal-content').innerHTML = contentHTML;
                document.getElementById('modal-container').classList.remove('hidden');
                lucide.createIcons();
            },
            closeModal: () => {
                document.getElementById('modal-container').classList.add('hidden');
                document.getElementById('modal-content').innerHTML = '';
            },
            handleSort: (col) => {
                if (state.tableState.sortBy === col) {
                    state.tableState.sortAsc = !state.tableState.sortAsc;
                } else {
                    state.tableState.sortBy = col;
                    state.tableState.sortAsc = true;
                }
                renderTableBody();
            },
            handleSearch: (val) => {
                state.tableState.searchTerm = val;
                renderTableBody();
            },
            toggleCustomInput: (selectEl, customInputId) => {
                const customWrapper = document.getElementById(customInputId);
                const customInput = customWrapper.querySelector('input');
                if (selectEl.value === 'OTHER') {
                    customWrapper.classList.remove('hidden');
                    customInput.required = true;
                } else {
                    customWrapper.classList.add('hidden');
                    customInput.required = false;
                    customInput.value = '';
                }
            },
            submitForm: (e) => {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);
                
                const shipLine = formData.get('shippingLine');
                const contSize = formData.get('containerSize');
                const dest = formData.get('destination');
                
                const data = {
                    id: formData.get('id') || null,
                    warehouse: formData.get('warehouse'),
                    destination: dest === 'OTHER' ? formData.get('customDestination') : dest,
                    shippingLine: shipLine === 'OTHER' ? formData.get('customShippingLine') : shipLine,
                    vessel: formData.get('vessel'),
                    siDate: formData.get('siDate'),
                    containerSize: contSize === 'OTHER' ? formData.get('customContainerSize') : contSize,
                    containerCount: parseInt(formData.get('containerCount'), 10),
                    notes: formData.get('notes')
                };
                window.app.saveShipment(data);
            },
            changeCalendarMonth: (offset) => {
                state.calendarDate = new Date(state.calendarDate.getFullYear(), state.calendarDate.getMonth() + offset, 1);
                render();
            },
            changeCalendarMode: (mode) => {
                state.calendarViewMode = mode;
                render();
            },
            openFormModal: (id = null, fixedWh = null) => {
                let s = id ? state.shipments.find(x => x.id === id) : {};
                const whVal = fixedWh || s.warehouse || 'NJ';
                
                const isLineOther = s.shippingLine && !SHIPPING_LINES.includes(s.shippingLine);
                const lineVal = isLineOther ? 'OTHER' : (s.shippingLine || 'MAERSK');
                const isSizeOther = s.containerSize && !CONTAINER_SIZES.includes(s.containerSize);
                const sizeVal = isSizeOther ? 'OTHER' : (s.containerSize || '40HC');
                const isDestOther = s.destination && !DESTINATIONS.includes(s.destination);
                const destVal = isDestOther ? 'OTHER' : (s.destination || 'JEBEL ALI');

                const title = id ? 'Edit Shipment' : 'New Shipment';

                const html = `
                    <div class="px-6 pt-6 pb-4 sm:p-6 sm:pb-4 border-b border-saas-border flex justify-between items-center bg-saas-control/50">
                        <h3 class="text-lg leading-6 font-bold text-saas-text flex items-center gap-2">
                            <i data-lucide="${id ? 'edit-2' : 'plus-circle'}" class="text-saas-text"></i> ${title}
                        </h3>
                        <button onclick="app.closeModal()" class="text-saas-muted hover:text-saas-text transition-colors"><i data-lucide="x"></i></button>
                    </div>
                    <form onsubmit="app.submitForm(event)" class="px-6 py-5 sm:p-6 bg-white space-y-5">
                        <input type="hidden" name="id" value="${s.id || ''}">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="${fixedWh ? 'hidden' : ''}">
                                <label class="block text-xs font-semibold text-saas-muted mb-1.5 uppercase tracking-wide">Warehouse</label>
                                <select name="warehouse" class="w-full rounded-xl border border-saas-border bg-saas-control text-saas-text focus:border-saas-text focus:ring-1 focus:ring-saas-text px-3 py-2.5 transition-colors outline-none" ${fixedWh ? 'disabled' : 'required'}>
                                    ${WAREHOUSES.map(w => `<option value="${w.id}" ${whVal === w.id ? 'selected' : ''}>${w.name}</option>`).join('')}
                                </select>
                                ${fixedWh ? `<input type="hidden" name="warehouse" value="${fixedWh}">` : ''}
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-saas-muted mb-1.5 uppercase tracking-wide">Destination</label>
                                <select name="destination" onchange="app.toggleCustomInput(this, 'customDestWrapper')" class="w-full rounded-xl border border-saas-border bg-saas-control text-saas-text focus:border-saas-text focus:ring-1 focus:ring-saas-text px-3 py-2.5 transition-colors outline-none" required>
                                    ${DESTINATIONS.map(d => `<option value="${d}" ${destVal === d ? 'selected' : ''}>${d}</option>`).join('')}
                                </select>
                                <div id="customDestWrapper" class="mt-2 ${isDestOther ? '' : 'hidden'}">
                                    <input type="text" name="customDestination" value="${isDestOther ? escapeHTML(s.destination) : ''}" placeholder="Enter Custom Destination" class="w-full rounded-xl border border-saas-border bg-white text-saas-text focus:border-saas-text focus:ring-1 focus:ring-saas-text px-3 py-2.5 placeholder-saas-muted transition-colors outline-none">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-saas-muted mb-1.5 uppercase tracking-wide">S.I. Date (Deadline)</label>
                                <input type="date" name="siDate" value="${s.siDate || todayStr()}" class="w-full rounded-xl border border-saas-border bg-saas-control text-saas-text focus:border-saas-text focus:ring-1 focus:ring-saas-text px-3 py-2.5 transition-colors outline-none" required>
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-saas-muted mb-1.5 uppercase tracking-wide">Vessel Name</label>
                                <input type="text" name="vessel" value="${escapeHTML(s.vessel)}" placeholder="e.g. MSC ISABELLA" class="w-full rounded-xl border border-saas-border bg-saas-control text-saas-text focus:border-saas-text focus:ring-1 focus:ring-saas-text px-3 py-2.5 placeholder-saas-muted transition-colors outline-none" required>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-saas-muted mb-1.5 uppercase tracking-wide">Shipping Line</label>
                                <select name="shippingLine" onchange="app.toggleCustomInput(this, 'customLineWrapper')" class="w-full rounded-xl border border-saas-border bg-saas-control text-saas-text focus:border-saas-text focus:ring-1 focus:ring-saas-text px-3 py-2.5 transition-colors outline-none" required>
                                    ${SHIPPING_LINES.map(l => `<option value="${l}" ${lineVal === l ? 'selected' : ''}>${l}</option>`).join('')}
                                </select>
                                <div id="customLineWrapper" class="mt-2 ${isLineOther ? '' : 'hidden'}">
                                    <input type="text" name="customShippingLine" value="${isLineOther ? escapeHTML(s.shippingLine) : ''}" placeholder="Enter Custom Line" class="w-full rounded-xl border border-saas-border bg-white text-saas-text focus:border-saas-text focus:ring-1 focus:ring-saas-text px-3 py-2.5 placeholder-saas-muted transition-colors outline-none">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-saas-muted mb-1.5 uppercase tracking-wide">Container Size</label>
                                <select name="containerSize" onchange="app.toggleCustomInput(this, 'customSizeWrapper')" class="w-full rounded-xl border border-saas-border bg-saas-control text-saas-text focus:border-saas-text focus:ring-1 focus:ring-saas-text px-3 py-2.5 transition-colors outline-none" required>
                                    ${CONTAINER_SIZES.map(sz => `<option value="${sz}" ${sizeVal === sz ? 'selected' : ''}>${sz}</option>`).join('')}
                                </select>
                                <div id="customSizeWrapper" class="mt-2 ${isSizeOther ? '' : 'hidden'}">

            openDayDetails: (dateStr) => {
                const active = state.shipments.filter(s => !s.isArchived && s.siDate === dateStr);
                let filtered = active;
                if(state.calendarViewMode !== 'COMBINED') {
                    filtered = active.filter(s => s.warehouse === state.calendarViewMode);

                const total = filtered.reduce((acc, s) => acc + s.containerCount, 0);

                // Added explicit enlargement inline style as requested

                        <h3 class="text-lg leading-6 font-bold text-saas-text flex items-center gap-2">

                        <button onclick="app.closeModal()" class="text-saas-muted hover:text-saas-text"><i data-lucide="x"></i></button>
                    </div>
                    <div class="p-6 bg-white space-y-6">
                        <div class="flex gap-4 p-6 bento-card justify-center">
                            <div class="text-center">
                                <p class="text-xs text-saas-muted uppercase font-semibold tracking-wider">Total Containers Due</p>

        // --- RENDERERS ---
        function renderSidebar() {
            const navItems = [
                { id: 'DASHBOARD', label: 'Dashboard', icon: 'home' },
                { type: 'divider' },
                ...WAREHOUSES.map(w => ({ id: `WH_${w.id}`, label: w.name, icon: 'map-pin' })),
                { type: 'divider' },
                { id: 'CALENDAR', label: 'Calendar', icon: 'calendar-days' },
                { id: 'SI_MONITOR', label: 'S.I. Monitor', icon: 'clock' },
                { type: 'divider' },
                { id: 'ARCHIVE', label: 'Archive', icon: 'archive' },
                { id: 'EXPORT', label: 'Reports', icon: 'download' },
            ];

            let html = `
                <div class="hidden md:flex items-center gap-3 pr-8 border-r border-saas-border h-full pl-6">

                <nav class="flex-1 flex flex-col md:flex-row md:items-center gap-2 p-4 md:p-0 md:px-6 h-full md:overflow-x-auto no-scrollbar bg-white">

            navItems.forEach((item, idx) => {
                if (item.type === 'divider') {

                    return;
                }
                const isActive = state.currentView === item.id;
                const activeClass = isActive 
                    ? 'bg-saas-text text-white shadow-md' 
                    : 'text-saas-muted hover:bg-saas-control hover:text-saas-text font-medium';
                html += `
                    <button onclick="app.navigate('${item.id}')" class="whitespace-nowrap flex items-center gap-2 px-3.5 py-2.5 md:py-2 rounded-xl transition-all text-sm ${activeClass}">
                        <i data-lucide="${item.icon}" class="w-4 h-4"></i>

            html += `
                </nav>

                </div>

            document.getElementById('sidebar').innerHTML = html;
        }

        function renderDashboard(activeShipments) {
            const today = todayStr();
            const total = activeShipments.reduce((sum, s) => sum + s.containerCount, 0);
            const todaysPulls = activeShipments.filter(s => s.siDate === today).reduce((sum, s) => sum + s.containerCount, 0);
            const upcomingPulls = activeShipments.filter(s => s.siDate && diffDays(s.siDate, today) > 0 && diffDays(s.siDate, today) <= 7).reduce((sum, s) => sum + s.containerCount, 0);
            
            const getWhTotal = (id) => activeShipments.filter(s => s.warehouse === id).reduce((sum, s) => sum + s.containerCount, 0);

            const warnings = [];
            const pastDue = activeShipments.filter(s => s.siDate && diffDays(s.siDate, today) < 0);
            if (pastDue.length > 0) warnings.push(`${pastDue.length} shipment(s) have past-due S.I. Dates.`);
            
            const todayRecords = activeShipments.filter(s => s.siDate === today);
            if (todayRecords.length > 0) warnings.push(`${todayRecords.length} shipment(s) with S.I. Deadline today.`);
            
            const dailyWhMap = {};
            activeShipments.forEach(s => {
                if(!s.siDate) return;
                const key = `${s.warehouse}_${s.siDate}`;
                if (!dailyWhMap[key]) dailyWhMap[key] = [];
                dailyWhMap[key].push(s);
            });
            const collisions = Object.values(dailyWhMap).filter(arr => arr.length > 1);
            if (collisions.length > 0) warnings.push(`${collisions.length} instances of multiple shipments for the same warehouse on the same S.I. Date.`);

            let html = `
                <div class="space-y-6 stagger-1 max-w-7xl mx-auto">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end pb-2 gap-4">
                        <div>
                            <h2 class="text-3xl font-bold text-saas-text tracking-tight">Global Dashboard</h2>
                            <p class="text-saas-muted mt-1 text-sm font-medium">Overview of all active S.I. workloads.</p>
                        </div>
                        <button onclick="app.openFormModal()" class="btn-primary px-5 py-2.5 rounded-xl text-sm font-medium flex items-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i> New Shipment
                        </button>
                    </div>

                    ${warnings.length > 0 ? `
                        <div class="bento-card border-red-100 bg-red-50/50 overflow-hidden stagger-2">
                            <div class="p-5 flex flex-col gap-2">
                                <div class="flex items-center gap-2 text-red-600 font-bold text-sm">
                                    <i data-lucide="alert-triangle" class="w-4 h-4"></i> Workload Warnings
                                </div>
                                <ul class="list-disc list-inside text-xs text-red-500 space-y-1 ml-1">
                                    ${warnings.map(w => `<li>${w}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    ` : ''}

                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-5 stagger-2">
                        <div class="bento-card p-6 col-span-2 md:col-span-2 lg:col-span-2 relative overflow-hidden group">
                            <div class="relative z-10">
                                <p class="text-saas-muted text-[11px] font-bold uppercase tracking-wider mb-2">Total Active Containers</p>
                                <p class="text-6xl font-bold text-saas-text tracking-tighter">${total}</p>
                            </div>
                        </div>
                        
                        ${WAREHOUSES.map(wh => `
                            <div class="bento-card p-6 flex flex-col justify-center border-t-2" style="border-top-color: var(--saas-border)">
                                <p class="text-saas-muted text-[10px] font-bold uppercase tracking-wider mb-2">${wh.id} Load</p>
                                <p class="text-4xl font-bold text-saas-text">${getWhTotal(wh.id)}</p>
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 stagger-3">
                        <div class="bento-card p-6 border-l-4 border-l-saas-text bg-white">
                            <p class="text-saas-text text-[11px] font-bold uppercase tracking-wider mb-2 flex items-center gap-2"><i data-lucide="clock" class="w-3.5 h-3.5"></i> Today's S.I. Deadline</p>
                            <p class="text-5xl font-bold text-saas-text tracking-tight">${todaysPulls}</p>
                        </div>
                        <div class="bento-card p-6">
                            <p class="text-saas-muted text-[11px] font-bold uppercase tracking-wider mb-2 flex items-center gap-2"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> Next 7 Days</p>
                            <p class="text-5xl font-bold text-saas-text tracking-tight">${upcomingPulls}</p>
                        </div>
                    </div>

                    <div class="bento-card p-6 stagger-3">
                        <h3 class="text-base font-bold text-saas-text mb-5 flex items-center gap-2">
                            Active Schedule
                        </h3>
                        ${buildTableHTML(activeShipments, false)}
                    </div>
                </div>
            `;
            return html;
        }

        function renderWarehouseView(whId, activeShipments) {
            const wh = WAREHOUSES.find(w => w.id === whId);
            const whShipments = activeShipments.filter(s => s.warehouse === whId);
            const today = todayStr();
            const total = whShipments.reduce((sum, s) => sum + s.containerCount, 0);
            const todayCount = whShipments.filter(s => s.siDate === today).reduce((sum, s) => sum + s.containerCount, 0);
            const upcomingCount = whShipments.filter(s => s.siDate && diffDays(s.siDate, today) > 0 && diffDays(s.siDate, today) <= 7).reduce((sum, s) => sum + s.containerCount, 0);

            let html = `
                <div class="space-y-6 stagger-1 max-w-7xl mx-auto">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end pb-2 gap-4">
                        <div>
                            <div class="flex items-center gap-3 mb-1">
                                <div class="w-10 h-10 rounded-xl flex items-center justify-center ${wh.colors.bg} ${wh.colors.text} font-bold text-sm border ${wh.colors.border}">${wh.id}</div>
                                <h2 class="text-3xl font-bold text-saas-text tracking-tight">${wh.name}</h2>
                            </div>
                            <p class="text-saas-muted mt-2 text-sm font-medium">Independent planning and scheduling</p>
                        </div>
                        <button onclick="app.openFormModal(null, '${wh.id}')" class="btn-primary px-5 py-2.5 rounded-xl text-sm font-medium flex items-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i> Add Shipment
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 stagger-2">
                        <div class="bento-card p-6">
                            <p class="text-saas-muted text-[11px] font-bold uppercase tracking-wider mb-2">Total Active Containers</p>
                            <p class="text-5xl font-bold text-saas-text">${total}</p>
                        </div>
                        <div class="bento-card p-6 border-l-4 border-l-saas-text">
                            <p class="text-saas-muted text-[11px] font-bold uppercase tracking-wider mb-2">Today's S.I.</p>
                            <p class="text-5xl font-bold text-saas-text">${todayCount}</p>
                        </div>
                        <div class="bento-card p-6">
                            <p class="text-saas-muted text-[11px] font-bold uppercase tracking-wider mb-2">Next 7 Days S.I.</p>
                            <p class="text-5xl font-bold text-saas-text">${upcomingCount}</p>
                        </div>
                    </div>

                    <div class="bento-card p-6 stagger-3">
                        <h3 class="text-base font-bold text-saas-text mb-5 flex items-center gap-2">
                            Shipment Records
                        </h3>
                        ${buildTableHTML(whShipments, true)}
                    </div>
                </div>
            `;
            return html;
        }

        function renderCalendarView(activeShipments) {
            const year = state.calendarDate.getFullYear();
            const month = state.calendarDate.getMonth();
            
            const getDaysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
            const getFirstDayOfMonth = (y, m) => new Date(y, m, 1).getDay();
            
            const daysInMonth = getDaysInMonth(year, month);
            const firstDay = getFirstDayOfMonth(year, month);
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            
            const days = [];
            for (let i = 0; i < firstDay; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) {
                days.push(`${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`);
            }

            const getDayData = (dateStr) => {
                if (!dateStr) return null;
                const dayShipments = activeShipments.filter(s => s.siDate === dateStr);
                let filtered = dayShipments;
                if (state.calendarViewMode !== 'COMBINED') {
                    filtered = dayShipments.filter(s => s.warehouse === state.calendarViewMode);
                }
                const total = filtered.reduce((sum, s) => sum + s.containerCount, 0);
                const byWh = {};
                WAREHOUSES.forEach(w => {
                    byWh[w.id] = filtered.filter(s => s.warehouse === w.id).reduce((sum, s) => sum + s.containerCount, 0);
                });
                return { total, byWh };
            };

            let gridHTML = days.map((dateStr, i) => {
                if (!dateStr) return `<div class="bg-[#F9FAFB] min-h-[120px] border-b border-r border-saas-border"></div>`;
                const data = getDayData(dateStr);
                const isToday = dateStr === todayStr();
                const dayNum = parseInt(dateStr.split('-')[2], 10);
                
                let contentHTML = '';
                if (data.total > 0) {
                    if (state.calendarViewMode === 'COMBINED') {
                        contentHTML = WAREHOUSES.map(w => {
                            const count = data.byWh[w.id];
                            if (!count) return '';
                            return `<div class="text-[10px] px-2 py-0.5 mt-1 rounded flex justify-between font-medium ${w.colors.bg} ${w.colors.text} border ${w.colors.border}">
                                <span>${w.id}</span><span>${count}</span>
                            </div>`;
                        }).join('');
                        contentHTML += `<div class="text-[10px] text-center font-bold text-saas-muted pt-2 border-t border-saas-border mt-2 uppercase">Total: <span class="text-saas-text">${data.total}</span></div>`;
                    } else {
                        contentHTML = `<div class="text-center py-2 mt-2 bg-saas-control text-saas-text rounded-lg font-bold text-sm border border-saas-border">${data.total} <span class="text-[10px] font-normal uppercase text-saas-muted">Cont</span></div>`;
                    }
                }

                return `
                    <div onclick="if(${data.total > 0}) app.openDayDetails('${dateStr}')" 
                         class="bg-white min-h-[120px] p-2 border-b border-r border-saas-border transition-colors relative group ${data.total > 0 ? 'cursor-pointer hover:bg-saas-bg' : ''} ${isToday ? 'bg-saas-soft/30 ring-1 ring-inset ring-saas-accent' : ''}">
                        ${isToday ? `<div class="absolute top-0 left-0 w-full h-1 bg-saas-accent"></div>` : ''}
                        <div class="text-sm font-semibold mb-1.5 ${isToday ? 'text-saas-text' : 'text-saas-muted'}">${dayNum}</div>
                        <div class="space-y-0.5">${contentHTML}</div>
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-6 stagger-1 max-w-7xl mx-auto">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end pb-2 gap-4">
                        <div>
                            <h2 class="text-3xl font-bold text-saas-text tracking-tight">Workload Calendar</h2>
                            <p class="text-saas-muted mt-1 text-sm font-medium">Container scheduling based on S.I. Deadline</p>
                        </div>
                        <div class="flex items-center gap-2 bg-white p-1 rounded-xl border border-saas-border shadow-sm">
                            <label class="text-[10px] font-bold text-saas-muted uppercase px-2 tracking-wider">View</label>
                            <select onchange="app.changeCalendarMode(this.value)" class="border-none bg-saas-control rounded-lg py-1.5 font-medium text-xs focus:ring-0 text-saas-text cursor-pointer outline-none">
                                <option value="COMBINED" ${state.calendarViewMode === 'COMBINED' ? 'selected' : ''}>All Warehouses</option>
                                ${WAREHOUSES.map(wh => `<option value="${wh.id}" ${state.calendarViewMode === wh.id ? 'selected' : ''}>${wh.id} Only</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="bento-card overflow-hidden flex flex-col stagger-2 shadow-sm">
                        <div class="flex justify-between items-center p-4 border-b border-saas-border bg-white">
                            <h3 class="text-lg font-bold text-saas-text tracking-tight">${monthNames[month]} ${year}</h3>
                            <div class="flex gap-1 bg-saas-control rounded-lg p-1 border border-saas-border">
                                <button onclick="app.changeCalendarMonth(-1)" class="p-1 hover:bg-white rounded text-saas-muted hover:text-saas-text transition-colors shadow-sm"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                                <button onclick="app.changeCalendarMonth(0)" class="px-3 py-1 hover:bg-white rounded text-saas-text font-medium text-xs transition-colors shadow-sm mx-1">Today</button>
                                <button onclick="app.changeCalendarMonth(1)" class="p-1 hover:bg-white rounded text-saas-muted hover:text-saas-text transition-colors shadow-sm"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                            </div>
                        </div>

                        ${state.calendarViewMode === 'COMBINED' ? `
                        <div class="flex flex-wrap gap-4 px-4 py-2 border-b border-saas-border text-[10px] font-bold uppercase tracking-wider bg-saas-control/50">
                            ${WAREHOUSES.map(w => `<div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded block ${w.colors.bg} border ${w.colors.border}"></span> <span class="text-saas-muted">${w.id}</span></div>`).join('')}
                        </div>
                        ` : ''}

                        <div class="grid grid-cols-7 border-l border-saas-border">
                            ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => `
                                <div class="bg-white py-2 text-center text-[10px] font-bold text-saas-muted uppercase tracking-wider border-b border-r border-saas-border">${day}</div>
                            `).join('')}
                            ${gridHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        function buildTableHTML(records, hideWarehouse = false) {
            let filtered = records.filter(s => {
                const term = state.tableState.searchTerm.toLowerCase();
                return s.vessel.toLowerCase().includes(term) || 
                       s.shippingLine.toLowerCase().includes(term) ||
                       (s.destination && s.destination.toLowerCase().includes(term)) ||
                       (s.notes && s.notes.toLowerCase().includes(term));
            });

            filtered.sort((a, b) => {
                const col = state.tableState.sortBy;
                let valA = a[col] || '9999-12-31'; 
                let valB = b[col] || '9999-12-31';
                if(col === 'containerCount') { valA = a[col]; valB = b[col]; }
                
                if (valA < valB) return state.tableState.sortAsc ? -1 : 1;
                if (valA > valB) return state.tableState.sortAsc ? 1 : -1;
                return 0;
            });

            return `
                <div id="table-wrapper" class="space-y-4">
                    <div class="flex justify-between items-center bg-white p-2 border border-saas-border rounded-xl shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
                        <div class="relative w-full max-w-sm">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-saas-muted w-4 h-4"></i>
                            <input type="text" placeholder="Search vessel, line, notes..." 
                                   value="${escapeHTML(state.tableState.searchTerm)}"
                                   oninput="app.handleSearch(this.value)"
                                   onfocus="this.selectionStart = this.selectionEnd = this.value.length"
                                   class="w-full pl-9 pr-3 py-2 text-sm bg-saas-control border border-transparent rounded-lg text-saas-text focus:bg-white focus:border-saas-border focus:ring-1 focus:ring-saas-border outline-none transition-all" autofocus>
                        </div>
                    </div>

                    <div class="overflow-x-auto border border-saas-border rounded-xl shadow-sm bg-white">
                        <table class="min-w-full divide-y divide-saas-border text-sm">
                            <thead class="bg-saas-control text-saas-muted text-[11px] uppercase tracking-wider font-semibold">
                                <tr>
                                    ${!hideWarehouse ? `<th class="px-4 py-3.5 text-left">Whs</th>` : ''}
                                    <th class="px-4 py-3.5 text-left cursor-pointer hover:text-saas-text transition-colors" onclick="app.handleSort('destination')">Destination <i data-lucide="arrow-up-down" class="inline w-3 h-3 ml-1"></i></th>
                                    <th class="px-4 py-3.5 text-left cursor-pointer hover:text-saas-text transition-colors" onclick="app.handleSort('shippingLine')">Line <i data-lucide="arrow-up-down" class="inline w-3 h-3 ml-1"></i></th>
                                    <th class="px-4 py-3.5 text-left cursor-pointer hover:text-saas-text transition-colors" onclick="app.handleSort('vessel')">Vessel <i data-lucide="arrow-up-down" class="inline w-3 h-3 ml-1"></i></th>
                                    <th class="px-4 py-3.5 text-left cursor-pointer hover:text-saas-text transition-colors" onclick="app.handleSort('siDate')">S.I. Date <i data-lucide="arrow-up-down" class="inline w-3 h-3 ml-1"></i></th>
                                    <th class="px-4 py-3.5 text-left">Size</th>
                                    <th class="px-4 py-3.5 text-center cursor-pointer hover:text-saas-text transition-colors" onclick="app.handleSort('containerCount')">Count <i data-lucide="arrow-up-down" class="inline w-3 h-3 ml-1"></i></th>
                                    <th class="px-4 py-3.5 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-saas-border bg-white">
                                ${filtered.length === 0 ? `<tr><td colspan="8" class="px-4 py-12 text-center text-saas-muted font-medium text-sm">No shipments match your criteria.</td></tr>` : 
                                  filtered.map(s => {
                                      const wh = WAREHOUSES.find(w => w.id === s.warehouse);
                                      const isPastSI = s.siDate && diffDays(s.siDate, todayStr()) < 0;
                                      return `
                                          <tr class="hover:bg-saas-control/50 transition-colors">
                                              ${!hideWarehouse ? `<td class="px-4 py-3 whitespace-nowrap"><span class="px-2 py-1 rounded text-[10px] font-semibold tracking-wider uppercase ${wh ? wh.colors.tag : 'bg-gray-100 text-gray-600'}">${s.warehouse}</span></td>` : ''}
                                              <td class="px-4 py-3 font-medium text-saas-text whitespace-nowrap">${escapeHTML(s.destination || 'Unassigned')}</td>
                                              <td class="px-4 py-3 font-medium text-saas-text whitespace-nowrap">${escapeHTML(s.shippingLine)}</td>
                                              <td class="px-4 py-3 text-saas-muted whitespace-nowrap font-medium">
                                                  <div class="flex items-center gap-2">
                                                      <span>${escapeHTML(s.vessel)}</span>
                                                      ${s.notes && s.notes.trim() !== '' ? `
                                                      <div class="relative group flex items-center z-10 hover:z-[9999]">
                                                          <div class="bg-saas-soft rounded-full p-1 border border-saas-accent/20 cursor-pointer">
                                                            <i data-lucide="message-square" class="w-3.5 h-3.5 text-green-700 transition-colors"></i>
                                                          </div>
                                                          <!-- High Z-Index Tooltip Preview -->
                                                          <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block w-64 p-3 bg-white text-xs text-saas-text rounded-xl shadow-xl z-[9999] whitespace-normal border border-saas-border pointer-events-none text-left font-sans font-normal leading-relaxed">
                                                              <div class="text-[10px] font-bold text-saas-muted uppercase tracking-widest mb-1 pb-1 border-b border-saas-border">Shipment Note</div>
                                                              ${escapeHTML(s.notes)}
                                                              <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-white border-b border-r border-saas-border rotate-45"></div>
                                                          </div>
                                                      </div>
                                                      ` : ''}
                                                  </div>
                                              </td>
                                              <td class="px-4 py-3 whitespace-nowrap">
                                                  <span class="${isPastSI ? 'text-red-700 font-bold bg-red-50 px-2 py-1 rounded border border-red-200' : 'text-saas-text font-medium'}">
                                                      ${formatDisplayDate(s.siDate)}
                                                  </span>
                                              </td>
                                              <td class="px-4 py-3 text-saas-muted whitespace-nowrap text-xs font-medium">${escapeHTML(s.containerSize)}</td>
                                              <td class="px-4 py-3 text-center font-bold text-saas-text text-base">${s.containerCount}</td>
                                              <td class="px-4 py-3 text-right whitespace-nowrap space-x-1">
                                                  <button onclick="app.openFormModal('${s.id}')" class="text-saas-muted hover:text-saas-text p-1.5 rounded hover:bg-saas-border transition-colors" title="Edit"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                                  ${s.isArchived ? 
                                                      `<button onclick="app.restoreShipment('${s.id}')" class="text-saas-muted hover:text-saas-text p-1.5 rounded hover:bg-saas-border transition-colors" title="Restore"><i data-lucide="check-circle" class="w-4 h-4"></i></button>` :
                                                      `<button onclick="app.archiveShipment('${s.id}')" class="text-saas-muted hover:text-saas-text p-1.5 rounded hover:bg-saas-border transition-colors" title="Archive"><i data-lucide="archive" class="w-4 h-4"></i></button>`
                                                  }
                                                  <button onclick="app.deleteShipment('${s.id}')" class="text-saas-muted hover:text-red-600 p-1.5 rounded hover:bg-red-50 transition-colors" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                              </td>
                                          </tr>
                                      `;
                                  }).join('')
                                }
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Helper to update just the table without full re-render
        function renderTableBody() {
            const active = state.currentView === 'ARCHIVE' ? state.shipments.filter(s => s.isArchived) : state.shipments.filter(s => !s.isArchived);
            let targetRecords = active;
            let hideWh = false;
            
            if (state.currentView.startsWith('WH_')) {
                const whId = state.currentView.replace('WH_', '');
                targetRecords = active.filter(s => s.warehouse === whId);
                hideWh = true;
            } else if (state.currentView === 'SI_MONITOR') {
                return render(); 
            } else if (state.currentView === 'CALENDAR') {
                return render();
            }

            const wrapper = document.getElementById('table-wrapper');
            if(wrapper) {
                const newHtml = buildTableHTML(targetRecords, hideWh);
                wrapper.outerHTML = newHtml;
                lucide.createIcons();
                const input = document.querySelector('input[placeholder="Search vessel, line, notes..."]');
                if(input) {
                    input.focus();
                    const val = input.value;
                    input.value = '';
                    input.value = val;
                }
            } else {
                render();
            }
        }

        function renderSIMonitoring(activeShipments) {
            const today = todayStr();
            const past = activeShipments.filter(s => diffDays(s.siDate, today) < 0);
            const todaySI = activeShipments.filter(s => s.siDate === today);
            const upcoming = activeShipments.filter(s => diffDays(s.siDate, today) > 0 && diffDays(s.siDate, today) <= 7);
            
            return `
                <div class="space-y-6 stagger-1 max-w-7xl mx-auto">
                    <div class="pb-2">
                        <h2 class="text-3xl font-bold text-saas-text tracking-tight">S.I. Date Monitoring</h2>
                        <p class="text-saas-muted mt-1 text-sm font-medium">Track Shipping Instruction deadlines proactively.</p>
                    </div>
                    
                    <div class="space-y-6">
                        <div class="bento-card border-red-200 bg-white p-6 relative overflow-hidden stagger-2">
                            <div class="absolute top-0 left-0 w-1 h-full bg-red-500"></div>
                            <h3 class="text-base font-bold text-red-600 mb-5 flex items-center gap-2">
                                <i data-lucide="alert-octagon" class="w-4 h-4"></i> Past Due S.I. Dates
                            </h3>
                            ${buildTableHTML(past)}
                        </div>

                        <div class="bento-card border-orange-200 bg-white p-6 relative overflow-hidden stagger-2">
                            <div class="absolute top-0 left-0 w-1 h-full bg-orange-400"></div>
                            <h3 class="text-base font-bold text-orange-600 mb-5 flex items-center gap-2">
                                <i data-lucide="clock" class="w-4 h-4"></i> S.I. Deadline Today
                            </h3>
                            ${buildTableHTML(todaySI)}
                        </div>

                        <div class="bento-card border-blue-200 bg-white p-6 relative overflow-hidden stagger-3">
                            <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                            <h3 class="text-base font-bold text-blue-600 mb-5 flex items-center gap-2">
                                <i data-lucide="calendar" class="w-4 h-4"></i> Approaching within 7 Days
                            </h3>
                            ${buildTableHTML(upcoming.sort((a,b) => new Date(a.siDate) - new Date(b.siDate)))}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderExportView() {
            return `
                <div class="space-y-6 max-w-5xl mx-auto stagger-1">
                    <div class="pb-2">
                        <h2 class="text-3xl font-bold text-saas-text tracking-tight">Export & Reports</h2>
                        <p class="text-saas-muted mt-1 text-sm font-medium">Download workload and scheduling data as CSV.</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 stagger-2">
                        <div class="bento-card p-6">
                            <div class="w-10 h-10 bg-saas-control rounded-lg flex items-center justify-center text-saas-text mb-4 border border-saas-border">
                                <i data-lucide="download" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-base font-bold text-saas-text mb-2">Export Active Shipments</h3>
                            <p class="text-xs text-saas-muted mb-6 min-h-[40px]">Download a complete CSV spreadsheet of all active records across all warehouses.</p>
                            <button onclick="app.exportCSV(state.shipments.filter(s => !s.isArchived), 'All_Active_Shipments')" class="btn-primary w-full py-2.5 text-sm font-medium rounded-xl flex justify-center items-center gap-2">
                                <i data-lucide="file-text" class="w-4 h-4"></i> Export Active File
                            </button>
                        </div>

                        <div class="bento-card p-6">
                            <div class="w-10 h-10 bg-saas-control rounded-lg flex items-center justify-center text-saas-text mb-4 border border-saas-border">
                                <i data-lucide="archive" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-base font-bold text-saas-text mb-2">Export Historical Archive</h3>
                            <p class="text-xs text-saas-muted mb-6 min-h-[40px]">Download a CSV of all historical, archived records.</p>
                            <button onclick="app.exportCSV(state.shipments.filter(s => s.isArchived), 'Archived_Shipments')" class="btn-secondary w-full py-2.5 text-sm font-medium rounded-xl flex justify-center items-center gap-2">
                                <i data-lucide="database" class="w-4 h-4"></i> Export Archive File
                            </button>
                        </div>
                    </div>

                    <h3 class="text-lg font-bold text-saas-text pt-4 stagger-3">Export by Warehouse</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 stagger-3">
                        ${WAREHOUSES.map(w => `
                            <div class="bento-card p-5 flex flex-col items-center text-center">
                                <div class="w-10 h-10 rounded-lg mb-3 flex items-center justify-center ${w.colors.bg} ${w.colors.text} border ${w.colors.border}">
                                    <i data-lucide="package" class="w-5 h-5"></i>
                                </div>
                                <h4 class="font-bold text-sm text-saas-text mb-4">${w.name}</h4>
                                <button onclick="app.exportCSV(state.shipments.filter(s => !s.isArchived && s.warehouse === '${w.id}'), '${w.id}_Shipments')" class="btn-secondary w-full py-2 text-xs font-medium rounded-lg">
                                    Export ${w.id}
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function render() {
            renderSidebar();
            
            const mainContent = document.getElementById('main-content');
            const activeShipments = state.shipments.filter(s => !s.isArchived);
            const archivedShipments = state.shipments.filter(s => s.isArchived);
            
            let html = '';
            
            if (state.currentView === 'DASHBOARD') {
                html = renderDashboard(activeShipments);
            } else if (state.currentView.startsWith('WH_')) {
                html = renderWarehouseView(state.currentView.replace('WH_', ''), activeShipments);
            } else if (state.currentView === 'CALENDAR') {
                html = renderCalendarView(activeShipments);
            } else if (state.currentView === 'SI_MONITOR') {
                html = renderSIMonitoring(activeShipments);
            } else if (state.currentView === 'ARCHIVE') {
                html = `
                    <div class="space-y-6 stagger-1 max-w-7xl mx-auto">
                        <div class="pb-2">
                            <h2 class="text-3xl font-bold text-saas-text tracking-tight">Historical Archive</h2>
                            <p class="text-saas-muted mt-1 text-sm font-medium">Archived records are excluded from active calculations and workload planning.</p>
                        </div>
                        <div class="bento-card p-6 stagger-2">
                            ${buildTableHTML(archivedShipments, false)}
                        </div>
                    </div>
                `;
            } else if (state.currentView === 'EXPORT') {
                html = renderExportView();
            } else {
                html = renderDashboard(activeShipments);
            }
            
            mainContent.innerHTML = html;
            lucide.createIcons(); // Initialize newly injected icons
        }

        // --- INIT ---
        window.onload = async () => {
            render();
            await initStorage();
        };

    </script>
</body>
</html>
